# Netlify: build settings and SPA routing.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Firebase JS SDK 13 requires Node >= 24.12.
  NODE_VERSION = "24"
  # The Firebase web config is public by design (it ships in the browser bundle);
  # data is protected by firestore.rules. Tell the secrets scanner not to block on it.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"

# Single-page app: every route (/app, /app/rutinas…) is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or updates would not reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
